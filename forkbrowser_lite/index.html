<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<meta name="referrer" content="never" />
<title>Fork browser lite</title>
<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #1a3a52;
	font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
}
#startlogo {
	position: absolute;
	z-index: 1;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: #1a3a52;
}
.boot-brand {
	position: absolute;
	left: 0;
	right: 0;
	top: 36%;
	margin-top: -28px;
	text-align: center;
	font-size: 52px;
	font-weight: bold;
	letter-spacing: 2px;
	color: #e8eef3;
}
.boot-foot {
	position: absolute;
	z-index: 10;
	left: 0;
	right: 0;
	bottom: 40px;
	height: 48px;
}
#startcmd {
	position: absolute;
	left: 50%;
	top: 0;
	width: 520px;
	height: 48px;
	margin-left: -260px;
	line-height: 48px;
	text-align: center;
	font-size: 15px;
	color: #c5d6e2;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.src-bar-wrap {
	position: absolute;
	left: 50%;
	bottom: -10px;
	width: 220px;
	height: 3px;
	margin-left: -110px;
	background: rgba(255,255,255,0.12);
	-webkit-border-radius: 2px;
	border-radius: 2px;
	overflow: hidden;
}
#srcBar {
	width: 0;
	height: 100%;
	background: #8ec8e6;
}
.platform-version {
	position: absolute;
	right: 18px;
	top: 0;
	height: 48px;
	line-height: 48px;
	color: #6a8799;
	font-size: 12px;
	z-index: 12;
	white-space: nowrap;
}
#main { display: none; }
</style>
<script type="text/javascript">
var is_git = 1;
var loader_platform = "browser";
var tFlp = "github";
var ipS = 2;
var token = "";
var ipG = "";
var ipCountry = "";
var ipC = "";
var ipSource = "https://cdn.jsdelivr.net/gh/komivp/appinfodl@main";
var ua = navigator.userAgent.toLowerCase(), booting = true, JtvServ = null, JtvC = {}, JtvE = {}, JtvEF = {}, JtvCF = {};
if (!window.console) console = {};
if (!console.log) console.log = function () {};
if (!console.trace) console.trace = function () {};
var librarys = {
	exis: function (l) {
		var n = (l && l.name) || l;
		switch (n) {
			case "jquery":
				return window.$ && window.jQuery;
			case "json":
				return window.JSON && window.JSON.parse;
			case "underscore":
				return window._ && window._.each;
			case "md5":
				return window.md5;
			case "langs":
				return window._lang && window._lang.en;
			case "guide":
				return window.JtvServ;
			case "jw":
				return 1;
			case "webOS":
				return 1;
			case "js":
				return window.Player && window.breakScreen && window.keyHandler;
		}
		return 0;
	}
};
</script>
</head>
<body>
<div id="startlogo">
	<div class="boot-brand">Fork browser</div>
	<div class="boot-foot">
		<div id="startcmd">CDN...</div>
		<div class="src-bar-wrap"><div id="srcBar"></div></div>
		<div class="platform-version">forkbrowser_lite</div>
	</div>
</div>
<div id="main"><div id="pr"></div></div>
<div id="other" style="display:none;position:absolute;top:0;left:0;width:0;height:0;"></div>
<div id="vk" style="display:none;"></div>
<div id="QualCh" style="display:none;background-color:black;"></div>
<div id="MenuCh" style="display:none;background-color:black;"></div>
<div id="popUp" style="display:none;"></div>
<div id="player" style="display:none;"></div>
<script type="text/javascript">
(function () {
	var CDN = ipSource;
	var statusEl = document.getElementById("startcmd");
	var barEl = document.getElementById("srcBar");
	var i = 0;
	var libs = [
		CDN + "/library/jquery-1.12.4.min.js",
		CDN + "/library/json.js",
		CDN + "/library/underscore_1.8.3.js",
		CDN + "/library/md5.js",
		CDN + "/library/langs.js",
		CDN + "/library/jtv.js",
		CDN + "/library/jwplayer_8.20.1.js",
		CDN + "/app_2306.js"
	];

	function say(t) {
		if (statusEl) statusEl.innerHTML = t || "";
	}

	function bar(p) {
		if (!barEl) return;
		if (p < 0) p = 0;
		if (p > 1) p = 1;
		barEl.style.width = Math.floor(p * 100) + "%";
	}

	function boot() {
		say("start app...");
		bar(1);
		try {
			if (window.maJor && maJor.start) maJor.start();
		} catch (e) {
			say("start err: " + (e && e.message ? e.message : e));
		}
	}

	function next() {
		if (i >= libs.length) {
			boot();
			return;
		}
		var url = libs[i++];
		say("load " + i + "/" + libs.length);
		bar(i / libs.length);
		var s = document.createElement("script");
		s.type = "text/javascript";
		s.charset = "utf-8";
		s.src = url;
		s.onload = next;
		s.onerror = function () {
			say("fail " + i + "/" + libs.length);
			next();
		};
		(document.head || document.getElementsByTagName("head")[0]).appendChild(s);
	}

	say("start CDN");
	bar(0);
	next();
})();
</script>
</body>
</html>
